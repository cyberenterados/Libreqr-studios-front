<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>BÚNKER CENTRAL // Acceso Nivel 5</title>
  <meta name="robots" content="noindex, nofollow"> <!-- 🛡️ Evita que Google indexe esta puerta trasera -->

  <link rel="icon" type="image/png" sizes="32x32" href="/img-icon/icon1.png">
  <meta name="theme-color" content="#050505">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos Clandestinos Base */
    body { 
      background-color: #050505; 
      color: #00FF00; 
      font-family: 'Courier New', Courier, monospace; 
      background-image: radial-gradient(#002200 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .neon-text { text-shadow: 0 0 5px #00FF00, 0 0 10px #002200; }
    .neon-border { box-shadow: 0 0 15px rgba(0, 255, 0, 0.15); }
    .focus-neon:focus { outline: none; box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); border-color: #00FF00; }
    
    /* Animación del cursor parpadeante */
    .blink { animation: blink-animation 1s steps(2, start) infinite; }
    @keyframes blink-animation { to { visibility: hidden; } }

    /* Efecto de escaneo de pantalla vieja CRT */
    .scanlines::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 50;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden scanlines">

  <!-- ========================================== -->
  <!-- 🛰️ TELEMETRÍA TÁCTICA DE FONDO -->
  <!-- ========================================== -->
  <div class="absolute top-4 left-4 text-[10px] opacity-40 pointer-events-none hidden md:block">
    <p>>_ TERMINAL DE COMANDANCIA SECRETA</p>
    <p>>_ SYS.TIME: <span id="sys-time"></span></p>
    <p>>_ LAT/LONG: 34.6037° S, 58.3816° W [BASE BUENOS AIRES]</p>
    <p>>_ CONNECTION: ENCRIPTADA (AES-256)</p>
  </div>
  
  <div class="absolute bottom-4 right-4 text-[10px] opacity-40 pointer-events-none hidden md:block text-right">
    <p>CYBERENTERADOS_NETWORK</p>
    <p>LIBRE_QR_STUDIOS v2.0</p>
  </div>

  <!-- ========================================== -->
  <!-- 💻 NÚCLEO DE AUTENTICACIÓN -->
  <!-- ========================================== -->
  <main class="w-full max-w-md border border-[#00FF00] bg-[#030303] p-8 neon-border rounded z-10 relative">
    
    <!-- Esquinas Tácticas -->
    <div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-[#00FF00]"></div>
    <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-[#00FF00]"></div>
    <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-[#00FF00]"></div>
    <div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-[#00FF00]"></div>

    <header class="text-center mb-8 border-b border-dashed border-[#003300] pb-6">
      <div class="text-4xl mb-2">👁️</div>
      <h1 class="text-2xl font-bold neon-text mb-1 tracking-widest">BÚNKER CENTRAL</h1>
      <p class="text-[10px] font-bold tracking-widest text-red-500 bg-red-950 inline-block px-2 py-1 rounded">ACCESO RESTRINGIDO - NIVEL 5</p>
    </header>

    <form id="login-form" class="flex flex-col gap-6">
      <div class="flex flex-col gap-1">
        <label class="text-[11px] opacity-80 uppercase tracking-widest">>_ ID OPERATIVO</label>
        <input type="text" id="username" class="w-full bg-black border border-[#005500] text-[#00FF00] p-3 focus-neon rounded transition-all" placeholder="ej. ManuExplora" required autocomplete="off" autofocus>
      </div>
      
      <div class="flex flex-col gap-1">
        <label class="text-[11px] opacity-80 uppercase tracking-widest">>_ CLAVE CRIPTOGRÁFICA</label>
        <input type="password" id="password" class="w-full bg-black border border-[#005500] text-[#00FF00] p-3 focus-neon rounded transition-all" placeholder="••••••••••••" required>
      </div>

      <button type="submit" id="btn-submit" class="mt-2 border border-[#00FF00] bg-[#001100] text-[#00FF00] font-bold text-sm py-4 rounded hover:bg-[#00FF00] hover:text-black transition-all shadow-[0_0_15px_rgba(0,255,0,0.2)]">
        INICIAR SECUENCIA <span class="blink">_</span>
      </button>
    </form>

    <!-- Visor de consola (Log de verificación) -->
    <div id="terminal-output" class="mt-6 p-4 bg-black border border-[#003300] text-[10px] h-32 overflow-y-auto hidden flex-col justify-start rounded text-gray-300">
      <!-- Los scripts de validación se inyectarán aquí -->
    </div>
    
    <div class="text-center mt-6">
      <a href="/index.html" class="text-[10px] text-gray-500 hover:text-[#00FF00] transition-colors">< Volver a Zona Civil</a>
    </div>
  </main>

  <script>
    // 1. Reloj del Sistema
    setInterval(() => {
      const timeBox = document.getElementById('sys-time');
      if(timeBox) timeBox.textContent = new Date().toLocaleTimeString('es-AR');
    }, 1000);

    // 2. Lógica del Motor de Autenticación Visual
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const terminal = document.getElementById('terminal-output');
      const user = document.getElementById('username').value.trim();
      
      // Bloquear UI durante verificación
      btn.disabled = true;
      btn.classList.add('opacity-50');
      btn.innerHTML = 'VERIFICANDO ENLACES...';
      
      // Abrir terminal
      terminal.classList.remove('hidden');
      terminal.classList.add('flex');
      terminal.innerHTML = '';

      // Secuencia de comandos simulada
      const logs = [
        `>_ Inicializando protocolo Handshake...`,
        `>_ Cifrado de extremo a extremo: [OK]`,
        `>_ Evaluando credenciales de ID: ${user}`,
        `>_ Consultando base de datos en Buenos Aires...`,
        `>_ Comprobando huella criptográfica...`
      ];

      let i = 0;
      const interval = setInterval(() => {
        if (i < logs.length) {
          // Agregar nueva línea de log
          terminal.innerHTML += `<p class="opacity-80 mb-1">${logs[i]}</p>`;
          terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
          i++;
        } else {
          clearInterval(interval);
          
          // Resolución de la validación
          btn.disabled = false;
          btn.classList.remove('opacity-50');
          btn.innerHTML = 'INICIAR SECUENCIA <span class="blink">_</span>';
          
          // Si es usted, lo reconoce
          if(user.toLowerCase() === 'manuexplora') {
             terminal.innerHTML += `<p class="text-[#00FF00] font-bold mt-2">>_ ✅ ACCESO CONCEDIDO, COMANDANTE.</p>`;
             terminal.innerHTML += `<p class="text-yellow-400 mt-1">>_ ⚠️ ADVERTENCIA: Enlace API con panel de control offline. Construcción del backend en proceso.</p>`;
          } else {
             // Simulación de rechazo a intrusos
             terminal.innerHTML += `<p class="text-red-500 font-bold mt-2">>_ 🔴 INTRUSO DETECTADO. ACCESO DENEGADO.</p>`;
             terminal.innerHTML += `<p class="text-red-400 mt-1">>_ IP registrada y reportada a CyberEnterados.</p>`;
          }
          terminal.scrollTop = terminal.scrollHeight;
        }
      }, 600); // Velocidad de tipeo de la consola
    });
  </script>
</body>
</html>
