<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BÚNKER CENTRAL | Acceso Clasificado</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
    body {
      background-color: #050505;
      color: #00FF00;
      font-family: 'Fira Code', monospace;
      position: relative;
      overflow-x: hidden;
    }
    /* 🟢 EFECTO MATRIX BACKGROUND */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      opacity: 0.15; /* Sutil para no distraer las operaciones */
      pointer-events: none;
    }
    .neon-border { border: 1px solid #00FF00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); background-color: rgba(5, 5, 5, 0.9); }
    .neon-text { text-shadow: 0 0 5px #00FF00; }
    .btn-action { transition: all 0.2s; cursor: pointer; padding: 4px 8px; border-radius: 4px; border: 1px solid transparent; }
    .btn-edit:hover { border-color: #00FFFF; background-color: rgba(0, 255, 255, 0.1); }
    .btn-vis:hover { border-color: #FFFF00; background-color: rgba(255, 255, 0, 0.1); }
    .btn-del:hover { border-color: #FF0000; background-color: rgba(255, 0, 0, 0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col p-6">

  <!-- Fondo dinámico Matrix -->
  <canvas id="matrix-canvas"></canvas>

  <!-- ========================================== -->
  <!-- 🔐 PANTALLA DE AUTENTICACIÓN TÁCTICA       -->
  <!-- ========================================== -->
  <div id="login-screen" class="flex-1 flex flex-col items-center justify-center">
    <div class="p-8 neon-border w-full max-w-md text-center">
      <h1 class="text-3xl font-bold mb-2 blink neon-text">>_ ACCESO RESTRINGIDO</h1>
      <p class="text-xs opacity-70 mb-6">Identifíquese, Comandante. Base de Operaciones B.A.</p>
      
      <input type="password" id="admin-key" placeholder="Ingrese ADMIN_SECRET_KEY..." 
        class="w-full p-3 bg-black border border-[#00FF00] text-[#00FF00] text-center font-mono outline-none mb-4 focus:shadow-[0_0_15px_rgba(0,255,0,0.5)] transition-shadow">
      
      <button id="btn-login" class="w-full bg-[#003300] border border-[#00FF00] py-3 font-bold hover:bg-[#00FF00] hover:text-black transition-colors">
        INICIAR SESIÓN CLANDESTINA
      </button>
      <p id="login-error" class="text-red-500 text-xs mt-4 hidden">🔴 CREDENCIALES INVÁLIDAS. ACCESO DENEGADO.</p>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 👁️ DASHBOARD CRUD & STATS (PANEL DE MANDO) -->
  <!-- ========================================== -->
  <div id="dashboard-screen" class="hidden flex-col h-[90vh]">
    <header class="flex justify-between items-end border-b border-[#00FF00] pb-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold neon-text">>_ TERMINAL DE TELEMETRÍA</h1>
        <p class="text-xs opacity-70 mb-2">Sistemas operativos. Enlace seguro establecido con Render.</p>
        <!-- 🟢 CONTADOR MAESTRO DE QRs -->
        <div class="inline-block bg-[#002200] border border-[#00FF00] px-3 py-1 rounded shadow-[0_0_8px_rgba(0,255,0,0.3)]">
          <span class="text-xs opacity-80">QRs GENERADOS:</span> 
          <span id="qr-counter" class="text-xl font-bold neon-text ml-2">--</span>
        </div>
      </div>
      <button id="btn-logout" class="border border-[#00FF00] text-xs py-1 px-4 text-red-500 hover:bg-red-900 hover:text-white transition-colors">
        [x] DESCONECTAR
      </button>
    </header>

    <div class="flex-1 overflow-auto border border-[#003300] bg-[#0a0a0a]/90 p-1 rounded">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-[#001100] border-b border-[#00FF00] sticky top-0 z-10">
          <tr>
            <th class="p-3">FECHA</th>
            <th class="p-3">RATING</th>
            <th class="p-3">COMENTARIO</th>
            <th class="p-3">ESTADO</th>
            <th class="p-3 text-right">OPERACIÓN TÁCTICA</th>
          </tr>
        </thead>
        <tbody id="telemetry-table">
          <!-- Datos inyectados por JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- ⚙️ SCRIPTS DEL BÚNKER (AISLADOS)           -->
  <!-- ========================================== -->
  <script>
    const API_URL = 'https://libreqr-studios-back.onrender.com/api';
    let secretKey = '';

    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const inputKey = document.getElementById('admin-key');
    const btnLogin = document.getElementById('btn-login');
    const tableBody = document.getElementById('telemetry-table');
    const errorMsg = document.getElementById('login-error');

    // === 🟢 MOTOR MATRIX BACKGROUND ===
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const characters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%-&/\\<>*+';
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    const drops = [];
    for (let i = 0; i < columns; i++) { drops[i] = 1; }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00FF00';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = characters.charAt(Math.floor(Math.random() * characters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);

    // === 1. PROTOCOLO DE INGRESO ===
    btnLogin.addEventListener('click', async () => {
      secretKey = inputKey.value.trim();
      if(!secretKey) return;
      
      btnLogin.innerText = "VERIFICANDO...";
      
      try {
        const response = await fetch(`${API_URL}/admin/feedback`, {
          method: 'GET',
          headers: { 'x-admin-key': secretKey }
        });

        if (response.ok) {
          loginScreen.classList.add('hidden');
          dashboardScreen.classList.remove('hidden');
          dashboardScreen.classList.add('flex');
          reloadData(); // Carga comentarios y contador maestro
        } else {
          errorMsg.classList.remove('hidden');
          btnLogin.innerText = "INICIAR SESIÓN CLANDESTINA";
        }
      } catch (err) {
        alert("🔴 FALLA DE ENLACE: No se pudo contactar con el servidor central.");
        btnLogin.innerText = "INICIAR SESIÓN CLANDESTINA";
      }
    });

    inputKey.addEventListener('keypress', (e) => { if(e.key === 'Enter') btnLogin.click(); });

    // === 2. MOTOR DE RENDERIZADO DE TABLA ===
    function renderTable(reviews) {
      tableBody.innerHTML = '';
      if(reviews.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center p-6 opacity-50">Radar despejado. Sin telemetría.</td></tr>`;
        return;
      }

      reviews.forEach(rev => {
        const date = new Date(rev.createdAt).toLocaleString('es-AR');
        const emojis = ['🤬', '🙁', '😐', '😊', '🚀'];
        const emoji = emojis[rev.rating - 1] || '🚀';
        
        const statusBadge = rev.isPublic 
          ? `<span class="bg-green-900 text-green-300 px-2 py-1 rounded text-xs border border-green-500 shadow-[0_0_5px_#00FF00]">PÚBLICO</span>` 
          : `<span class="bg-red-900 text-red-300 px-2 py-1 rounded text-xs border border-red-500 shadow-[0_0_5px_#FF0000]">OCULTO</span>`;

        const spamFlag = rev.isSpam ? `<span class="ml-2 blink text-red-500" title="Posible SPAM">🚩</span>` : '';
        const safeComment = rev.comment ? rev.comment.replace(/'/g, "\\'") : '';

        const row = `
          <tr class="border-b border-[#002200] hover:bg-[#001100] transition-colors">
            <td class="p-3 opacity-80 text-xs">${date}</td>
            <td class="p-3 text-xl">${emoji}</td>
            <td class="p-3 text-gray-300 text-xs max-w-xs truncate" title="${rev.comment || 'Sin texto'}">${rev.comment || '<i>Silencioso</i>'}${spamFlag}</td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3 text-right">
              <button onclick="editComment('${rev._id}', '${safeComment}')" class="btn-action btn-edit text-[#00FFFF] mr-2" title="Sobrescribir Texto">
                ✏️ Editar
              </button>
              <button onclick="toggleVisibility('${rev._id}', ${!rev.isPublic})" class="btn-action btn-vis text-[#FFFF00] mr-2" title="Alternar Visibilidad">
                ${rev.isPublic ? '👁️ Ocultar' : '🟢 Mostrar'}
              </button>
              <button onclick="purgeData('${rev._id}')" class="btn-action btn-del text-[#FF0000]" title="Eliminar de la Bóveda">
                🗑️ Purgar
              </button>
            </td>
          </tr>
        `;
        tableBody.insertAdjacentHTML('beforeend', row);
      });
    }

    // === 3. ACCIÓN TÁCTICA: EDITAR TEXTO (PUT) ===
    window.editComment = async (id, currentComment) => {
      const newComment = prompt(">_ Ingrese el nuevo texto de telemetría (máx. 140 caracteres):", currentComment);
      if (newComment === null || newComment.trim() === currentComment) return;

      try {
        const res = await fetch(`${API_URL}/admin/feedback/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-key': secretKey },
          body: JSON.stringify({ comment: newComment.trim() })
        });
        if (res.ok) reloadData();
        else alert("🔴 ERROR AL SOBRESCRIBIR LA BÓVEDA.");
      } catch (e) { console.error("🔴 Falla de enlace:", e); }
    };

    // === 4. ACCIÓN TÁCTICA: CAMBIAR VISIBILIDAD (PUT) ===
    window.toggleVisibility = async (id, makePublic) => {
      try {
        const res = await fetch(`${API_URL}/admin/feedback/${id}/visibility`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-key': secretKey },
          body: JSON.stringify({ isPublic: makePublic })
        });
        if(res.ok) reloadData();
        else alert("🔴 Error al cambiar estado.");
      } catch (e) { console.error(e); }
    };

    // === 5. ACCIÓN TÁCTICA: PURGAR (DELETE) ===
    window.purgeData = async (id) => {
      if(!confirm("⚠️ ¿Autoriza la destrucción irreversible de esta telemetría?")) return;
      try {
        const res = await fetch(`${API_URL}/admin/feedback/${id}`, {
          method: 'DELETE',
          headers: { 'x-admin-key': secretKey }
        });
        if(res.ok) reloadData();
        else alert("🔴 Error al ejecutar purga.");
      } catch (e) { console.error(e); }
    };

    // === 6. RECARGA SILENCIOSA DE DATOS Y ESTADÍSTICAS ===
    async function reloadData() {
      // Cargar comentarios
      const resFeedback = await fetch(`${API_URL}/admin/feedback`, { headers: { 'x-admin-key': secretKey } });
      if(resFeedback.ok) {
        const data = await resFeedback.json();
        renderTable(data.reviews);
      }

      // Cargar Contador Global
      try {
        const resStats = await fetch(`${API_URL}/admin/stats`, { headers: { 'x-admin-key': secretKey } });
        if(resStats.ok) {
          const stats = await resStats.json();
          document.getElementById('qr-counter').innerText = stats.totalQrGenerated;
        }
      } catch (e) {
        console.error("🔴 Error obteniendo estadísticas de radar.", e);
      }
    }

    // === 7. PROTOCOLO DE SALIDA ===
    document.getElementById('btn-logout').addEventListener('click', () => {
      secretKey = '';
      tableBody.innerHTML = '';
      dashboardScreen.classList.add('hidden');
      dashboardScreen.classList.remove('flex');
      loginScreen.classList.remove('hidden');
      inputKey.value = '';
    });
  </script>
</body>
</html>
